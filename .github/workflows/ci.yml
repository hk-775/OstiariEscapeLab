name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escape-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: python -m pip install ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run core regression suite
        run: python -m unittest discover -s tests -v

  wheel:
    name: Installed wheel smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Install and run outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/escape-lab-wheel"
          "${RUNNER_TEMP}/escape-lab-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/escape-lab-wheel/bin/escape-lab" validate
          "${RUNNER_TEMP}/escape-lab-wheel/bin/escape-lab" list
          "${RUNNER_TEMP}/escape-lab-wheel/bin/escape-lab" \
            --artifacts-root "${RUNNER_TEMP}/escape-lab-artifacts" \
            run S06 --profile C4
          "${RUNNER_TEMP}/escape-lab-wheel/bin/escape-lab" \
            init "${RUNNER_TEMP}/consumer"

  gvisor-agent-gate:
    name: Credential-free gVisor Agent-RPC containment gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out Escape Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned gVisor runtime
        env:
          GVISOR_RELEASE_PATH: release/20260817.0
          GVISOR_ARCHIVE_SHA512: bd8271a7742f90e53373b2a8613f37f3ae2c765ff5e2e611a75a47167a323cab7519b149c50273307743491713525a14ad1b3e398651c93b16f3e248dfeff3dd
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gvisor.tar.bz2"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            "https://storage.googleapis.com/gvisor/releases/${GVISOR_RELEASE_PATH}/x86_64/gvisor.tar.bz2" \
            --output "${archive}"
          printf '%s  %s\n' "${GVISOR_ARCHIVE_SHA512}" "${archive}" \
            | sha512sum --check -
          sudo tar \
            --extract \
            --bzip2 \
            --file "${archive}" \
            --directory /usr/local/bin \
            runsc \
            containerd-shim-runsc-v1
          sudo chmod 0755 \
            /usr/local/bin/runsc \
            /usr/local/bin/containerd-shim-runsc-v1
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          /usr/local/bin/runsc --version
          docker info --format '{{json .Runtimes}}' \
            | python -c 'import json,sys; runtimes=json.load(sys.stdin); assert "runsc" in runtimes, runtimes'

      - name: Install Escape Lab
        run: python -m pip install ".[dev]"

      - name: Build reviewed external Agent-RPC image
        run: |
          docker build \
            --file examples/agent-rpc/Dockerfile \
            --tag escape-lab-external-agent:ci \
            .

      - name: Run real arbitrary-agent integration under gVisor
        env:
          ESCAPE_LAB_EXTERNAL_AGENT_IMAGE: escape-lab-external-agent:ci
          ESCAPE_LAB_AGENT_RUNTIME: runsc
        run: |
          python -m unittest \
            tests.test_agent_sandbox.AgentSandboxTests.test_real_external_agent_runs_behind_pre_attested_policy \
            -v

      - name: Run credential-free gVisor containment gate
        run: |
          python -m escape_lab \
            --artifacts-root artifacts/gvisor-external \
            --agent external \
            --agent-runtime gvisor \
            --agent-image escape-lab-external-agent:ci \
            gate \
            --baseline baselines/gvisor-external.json \
            --output-dir artifacts/gvisor-external/gate

      - name: Preserve gVisor containment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: credential-free-gvisor-agent-evidence
          path: artifacts/gvisor-external
          if-no-files-found: warn
          retention-days: 14

  axonllm-gate:
    if: ${{ vars.ENABLE_PRIVATE_INTEGRATIONS == 'true' }}
    name: AxonLLM containment gate (optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Escape Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check out pinned AxonLLM
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: hk-775/axonllm
          ref: 7a26ed1f73c91c57f1a18257dc357b2e0cb4988d
          path: vendor/AxonLLM
          persist-credentials: false
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run AxonLLM integration test
        env:
          AXONLLM_SRC: vendor/AxonLLM
        run: |
          python -m pip install ".[dev]" ./vendor/AxonLLM
          python -m unittest tests.test_axonllm_integration -v

      - name: Run first-product gate
        id: escape-lab
        uses: ./
        with:
          axonllm-path: vendor/AxonLLM
          artifacts-root: artifacts

      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: axonllm-escape-lab-evidence
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  incident-gate:
    if: ${{ vars.ENABLE_PRIVATE_INTEGRATIONS == 'true' }}
    name: Ostiari incident replay (optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Escape Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check out pinned Ostiari
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: hk-775/ostiari
          ref: 6219609bfb39fdcf02657a9b6dfdb61747fab3cb
          path: vendor/ostiari
          persist-credentials: false
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Escape Lab and Ostiari
        run: python -m pip install ".[dev]" ./vendor/ostiari

      - name: Build isolated range image
        run: |
          docker build \
            --file docker/range/Dockerfile \
            --tag escape-lab-range:ci \
            .

      - name: Run incident integration tests
        env:
          OSTIARI_SRC: vendor/ostiari
        run: python -m unittest tests.test_incident_replay -v

      - name: Run real OCI range integration
        env:
          ESCAPE_LAB_SANDBOX_IMAGE: escape-lab-range:ci
        run: python -m unittest tests.test_sandbox -v

      - name: Run incident containment gate in the OCI range
        run: |
          python -m escape_lab \
            --project-root incidents/openai-huggingface-july-2026 \
            --artifacts-root artifacts/incident \
            --backend ostiari \
            --ostiari-src vendor/ostiari \
            --range-backend docker \
            --sandbox-image escape-lab-range:ci \
            gate \
            --baseline incidents/openai-huggingface-july-2026/sandbox-baseline.json \
            --output-dir artifacts/incident/gate

      - name: Upload incident evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openai-hf-incident-replay-evidence
          path: artifacts/incident
          if-no-files-found: error
          retention-days: 14

  public-oci-gate:
    name: Public OCI incident range gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Escape Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Escape Lab
        run: python -m pip install ".[dev]"

      - name: Build isolated range image
        run: |
          docker build \
            --file docker/range/Dockerfile \
            --tag escape-lab-range:ci \
            .

      - name: Run real OCI range integration
        env:
          ESCAPE_LAB_SANDBOX_IMAGE: escape-lab-range:ci
        run: python -m unittest tests.test_sandbox -v

      - name: Run self-contained OCI incident gate
        run: |
          python -m escape_lab \
            --project-root incidents/openai-huggingface-july-2026 \
            --artifacts-root artifacts/public-oci \
            --backend reference \
            --range-backend docker \
            --sandbox-image escape-lab-range:ci \
            gate \
            --baseline incidents/openai-huggingface-july-2026/reference-sandbox-baseline.json \
            --output-dir artifacts/public-oci/gate

      - name: Upload OCI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-oci-incident-evidence
          path: artifacts/public-oci
          if-no-files-found: error
          retention-days: 14
