name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check ruff==0.16.4

      - name: Validate release metadata
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Lint
        if: ${{ matrix.python-version == '3.12' }}
        run: python -m ruff check src tests scripts

      - name: Run regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  release:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install release tools
        run: |
          python -m pip install \
            --disable-pip-version-check \
            build==1.5.0 \
            ruff==0.16.4 \
            twine==7.0.0

      - name: Validate release metadata
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Smoke-test installed wheel
        run: |
          release_env="${RUNNER_TEMP}/escape-lab-release"
          python -m venv "${release_env}"
          "${release_env}/bin/python" -m pip install \
            --disable-pip-version-check \
            dist/*.whl
          cd "${RUNNER_TEMP}"
          "${release_env}/bin/escape-lab" validate
          "${release_env}/bin/escape-lab" list
          "${release_env}/bin/escape-lab" \
            --artifacts-root "${RUNNER_TEMP}/release-smoke-artifacts" \
            run S06 --profile C4

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz >SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Preserve release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9] ]]; then
            release_args+=(--prerelease)
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            "${release_args[@]}"
